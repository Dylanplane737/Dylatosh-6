<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dylatosh 6 - OS Prototype</title>
<style>
  body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: #0078D7;
    overflow: hidden;
  }

  /* Desktop area */
  #desktop {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 40px; /* leave space for taskbar */
    background: url('https://wallpapercave.com/wp/wp6060236.jpg') center/cover no-repeat;
  }

  /* Taskbar */
  #taskbar {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 40px;
    background: #1b1b1b;
    display: flex;
    align-items: center;
    padding: 0 10px;
  }

  /* Start menu button */
  #start-button {
    width: 100px;
    height: 30px;
    background: #0078D7;
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
  }

  /* Start menu panel */
  #start-menu {
    position: absolute;
    bottom: 40px;
    left: 10px;
    width: 250px;
    background: #2b2b2b;
    color: white;
    border-radius: 6px;
    display: none;
    flex-wrap: wrap;
    padding: 10px;
  }

  /* App buttons in start menu */
  .app-btn {
    width: 100px;
    height: 40px;
    background: #3b3b3b;
    color: white;
    margin: 5px;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    user-select: none;
  }

  .app-btn:hover {
    background: #5b5b5b;
  }

  /* Window */
  .window {
    position: absolute;
    top: 50px;
    left: 50px;
    width: 400px;
    height: 300px;
    background: white;
    border: 2px solid #000;
    border-radius: 6px;
    display: none;
    flex-direction: column;
  }

  .window-header {
    background: #0078D7;
    color: white;
    padding: 5px;
    cursor: move;
    border-top-left-radius: 6px;
    border-top-right-radius: 6px;
  }

  .window-content {
    flex: 1;
    padding: 10px;
    overflow: auto;
  }

  .close-btn {
    background: red;
    width: 20px;
    height: 20px;
    border: none;
    color: white;
    float: right;
    cursor: pointer;
    border-radius: 3px;
  }
</style>
</head>
<body>

<div id="desktop"></div>

<div id="taskbar">
  <button id="start-button">Start</button>
</div>

<div id="start-menu">
  <div class="app-btn" onclick="openWindow('homepage')">Homepage</div>
  <div class="app-btn">App 1</div>
  <div class="app-btn">App 2</div>
  <div class="app-btn">App 3</div>
  <div class="app-btn">App 4</div>
  <div class="app-btn">App 5</div>
  <div class="app-btn">App 6</div>
  <div class="app-btn">App 7</div>
  <div class="app-btn">App 8</div>
  <div class="app-btn">App 9</div>
  <div class="app-btn">App 10</div>
  <div class="app-btn">App 11</div>
  <div class="app-btn">App 12</div>
  <div class="app-btn">App 13</div>
  <div class="app-btn">App 14</div>
  <div class="app-btn">App 15</div>
</div>

<!-- Homepage window -->
<div class="window" id="homepage">
  <div class="window-header">
    Homepage
    <button class="close-btn" onclick="closeWindow('homepage')">X</button>
  </div>
  <div class="window-content">
    <h2>Welcome to Dylatosh 6!</h2>
    <p>This is the homepage, inside the start menu.</p>
    <p>Filler content: lots of buttons, apps, and more coming soon!</p>
  </div>
</div>

<script>
  const startButton = document.getElementById('start-button');
  const startMenu = document.getElementById('start-menu');

  startButton.addEventListener('click', () => {
    startMenu.style.display = startMenu.style.display === 'flex' ? 'none' : 'flex';
  });

  function openWindow(id) {
    document.getElementById(id).style.display = 'flex';
    startMenu.style.display = 'none';
  }

  function closeWindow(id) {
    document.getElementById(id).style.display = 'none';
  }

  // Optional: make window draggable
  const windows = document.querySelectorAll('.window');
  windows.forEach(win => {
    const header = win.querySelector('.window-header');
    let offsetX, offsetY, isDragging = false;

    header.addEventListener('mousedown', (e) => {
      isDragging = true;
      offsetX = e.clientX - win.offsetLeft;
      offsetY = e.clientY - win.offsetTop;
    });

    document.addEventListener('mousemove', (e) => {
      if (isDragging) {
        win.style.left = (e.clientX - offsetX) + 'px';
        win.style.top = (e.clientY - offsetY) + 'px';
      }
    });

    document.addEventListener('mouseup', () => {
      isDragging = false;
    });
  });
</script>

</body>
</html>
